name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      minimum_compiler:
        description: Qualify the current public selection with its Go 1.27.0 compiler floor
        type: boolean
        required: false
        default: false
      release_integrity:
        description: Retrospective fixed release inventories and Tools 2.5.1 byte reproduction
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: true
          vulnerability-check: true
          warn-only: false

  quality:
    name: Selection and scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 09b43f49385650c44dd4151a12b0877ca6b48a88
          path: .tools
          persist-credentials: false
      - name: Check current selection and refusal behavior
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tools/compatibility/check-selection.py
          python3 -m unittest discover -s tools/compatibility -p test_selection.py
          python3 -m unittest discover -s .github/scripts -p test_required.py
          python3 -m unittest discover -s .github/scripts -p test_source_cleanup.py
          python3 -m unittest discover -s .github/scripts -p test_advisory.py
          python3 -m unittest discover -s .github/scripts -p test_release_integrity.py
      - name: Select affected public scenarios
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          PUBLICATION_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          CONSUMER_DIRECTORY: scenarios/compatibility-consumer
        run: python3 .tools/.github/scripts/select-compatibility-consumer.py

  source-docs:
    name: Source documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 09b43f49385650c44dd4151a12b0877ca6b48a88
          path: .golib-tooling
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: faustbrian/go-library-tools/.github/actions/setup-golib@ef9ae418c61b6b92d8d93c03d71694031ec47ed8
        with:
          source_bootstrap: 'true'
          tooling_sha: 09b43f49385650c44dd4151a12b0877ca6b48a88
      - name: Check tracked source documentation without framework metadata
        run: golib source-docs check --json
      - name: Remove exact owned source bootstrap workspace
        if: always()
        run: bash .github/scripts/cleanup-source-bootstrap.sh

  secrets:
    name: Changed-content secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan changed contents with the pinned standard scanner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/assurance-secrets.XXXXXX")"
          cleanup() {
            local status=$?
            trap - EXIT
            chmod -R u+w "${task}" || status=1
            find "${task}" -depth -delete || status=1
            exit "${status}"
          }
          trap cleanup EXIT
          # Same scanner version as Tools, without compiling it for every change.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 90 --max-filesize 16777216 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${task}/scanner.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | \
            (cd "${task}" && sha256sum --check --strict)
          tar -xzf "${task}/scanner.tar.gz" -C "${task}" gitleaks
          test -f "${task}/gitleaks" && test ! -L "${task}/gitleaks"
          # Never let checkout .gitleaks.toml or config environment suppress rules.
          printf '[extend]\nuseDefault=true\n' >"${task}/scanner.toml"
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          if test "${EVENT_NAME}" = workflow_dispatch; then
            "${task}/gitleaks" dir . --config "${task}/scanner.toml" --redact --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          else
            "${task}/gitleaks" git . --config "${task}/scanner.toml" --log-opts="${BASE_SHA}..HEAD" --redact --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          fi

  scenarios:
    name: Public compositions (${{ matrix.platform }})
    if: needs.quality.outputs.required == 'true'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: 09b43f49385650c44dd4151a12b0877ca6b48a88
          path: .tools
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Resolve and test selected public compositions
        env:
          CONSUMER_DIRECTORY: scenarios/compatibility-consumer
          SCENARIO_FILES: ${{ needs.quality.outputs.files }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: bash .tools/.github/scripts/run-compatibility-consumer.sh

  minimum-compiler:
    name: Minimum compiler (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.minimum_compiler
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Test the unchanged selected graph with the declared minimum compiler
        env:
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/assurance-minimum-compiler.XXXXXX")"
          cleanup() {
            local status=$?
            trap - EXIT
            chmod -R u+w "${task}" || status=1
            find "${task}" -depth -delete || status=1
            exit "${status}"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          export GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp"
          export GOENV=off GOWORK=off GOTOOLCHAIN=local GOMAXPROCS=2 GOFLAGS=-p=1
          export GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org
          export GOPRIVATE='' GONOPROXY='' GONOSUMDB=''
          test "$(go env GOVERSION)" = go1.27.0
          test "$(go env GOHOSTOS)" = "${EXPECTED_GOOS}"
          test "$(go env GOHOSTARCH)" = "${EXPECTED_GOARCH}"
          test "$(go env GOOS)" = "${EXPECTED_GOOS}"
          test "$(go env GOARCH)" = "${EXPECTED_GOARCH}"
          go version
          cd scenarios/compatibility-consumer
          shasum -a 256 go.mod go.sum >"${task}/module-files.sha256"
          test "$(go list -m -f '{{.GoVersion}}')" = 1.27.0
          go list -mod=readonly -m -f '{{if .Replace}}{{.Path}}{{end}}' all >"${task}/replacements"
          if grep -q '[^[:space:]]' "${task}/replacements"; then
            echo 'minimum compiler qualification refuses module replacements' >&2
            exit 1
          fi
          go test -mod=readonly -count=1 -timeout=20m ./...
          go mod verify
          shasum -a 256 -c "${task}/module-files.sha256"

  release-integrity:
    name: Fixed release integrity
    if: github.event_name == 'workflow_dispatch' && inputs.release_integrity
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install immutable public attestation client
        id: github-cli
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/assurance-release-cli.XXXXXX")"
          printf 'directory=%s\n' "${task}" >>"${GITHUB_OUTPUT}"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 --max-filesize 67108864 \
            https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
            --output "${task}/client.tar.gz"
          echo 'bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  client.tar.gz' | \
            (cd "${task}" && sha256sum --check --strict)
          tar -xzf "${task}/client.tar.gz" -C "${task}" gh_2.102.0_linux_amd64/bin/gh
          echo "${task}/gh_2.102.0_linux_amd64/bin" >>"${GITHUB_PATH}"
      - name: Qualify the fixed immutable release inputs
        id: recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/qualify-release-integrity.sh
      - name: Retain retrospective inventories and byte-comparison evidence
        if: always() && steps.recipe.outputs.evidence != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fixed-release-integrity
          path: ${{ steps.recipe.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
      - name: Remove exact owned evidence and attestation client
        if: always()
        env:
          CLI_DIRECTORY: ${{ steps.github-cli.outputs.directory }}
          EVIDENCE_DIRECTORY: ${{ steps.recipe.outputs.evidence }}
        run: |
          set -euo pipefail
          if [[ -n "${CLI_DIRECTORY}" ]]; then
            [[ "${CLI_DIRECTORY}" == "${RUNNER_TEMP}/assurance-release-cli."* ]]
            test -d "${CLI_DIRECTORY}" && test ! -L "${CLI_DIRECTORY}"
            chmod -R u+w "${CLI_DIRECTORY}"
            find "${CLI_DIRECTORY}" -depth -delete
          fi
          if [[ -n "${EVIDENCE_DIRECTORY}" ]]; then
            test "${EVIDENCE_DIRECTORY}" = "${RUNNER_TEMP}/assurance-release-integrity-evidence"
            test -d "${EVIDENCE_DIRECTORY}" && test ! -L "${EVIDENCE_DIRECTORY}"
            find "${EVIDENCE_DIRECTORY}" -depth -delete
          fi

  required:
    name: Required
    if: always()
    needs: [dependency-review, quality, secrets, source-docs, scenarios, minimum-compiler, release-integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SOURCE_DOCS_RESULT: ${{ needs.source-docs.result }}
          SCENARIOS_REQUIRED: ${{ needs.quality.outputs.required }}
          SCENARIOS_RESULT: ${{ needs.scenarios.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          MINIMUM_COMPILER_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.minimum_compiler && 'true' || 'false' }}
          MINIMUM_COMPILER_RESULT: ${{ needs.minimum-compiler.result }}
          RELEASE_INTEGRITY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.release_integrity && 'true' || 'false' }}
          RELEASE_INTEGRITY_RESULT: ${{ needs.release-integrity.result }}
        run: bash .github/scripts/check-required.sh
